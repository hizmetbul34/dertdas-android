name: Dertdas APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZIP ac
        run: unzip -o ONLINE-V5.zip

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses > /dev/null || true
          "$SDK" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK olustur
        working-directory: dert-das
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Dertdas-APK
          path: dert-das/app/build/outputs/apk/debug/*.apk
